<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex</title>
    <link rel="icon" type="image/svg+xml" href="favicon.png" />
    <link rel="stylesheet" href="assets/css/fonts.css" />
    <link rel="stylesheet" href="assets/css/standard.css" />
    <link rel="stylesheet" href="assets/css/pokemon_grid.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="pokedex-header">
      <div class="header-container">
        <div class="heading">
          <svg class="poke-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="3"></circle>
            <line x1="2" y1="12" x2="9" y2="12"></line>
            <line x1="15" y1="12" x2="22" y2="12"></line>
          </svg>
          <h1 class="heading-name">Pokédex</h1>
        </div>
        <input type="search" class="search-input" data-id="search-input" placeholder="Pokemon" aria-label="Search for Pokemon" />
      </div>
    </header>

    <main data-id="content">
      <div id="card-content" class="pokemon-grid">
        <button class="card-oldschool type-fire" data-id="card">
          <div class="card-header">
            <span class="card-id">test</span>
            <h2 class="card-name">Glumanda</h2>
          </div>
          <div class="card-image-box">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/4.png" alt="Glumanda" data-id="card-image" loading="lazy" />
          </div>
          <div class="card-footer">
            <span class="type-badge">Fire</span>
          </div>
        </button>

        <button class="card-oldschool type-water" data-id="card">
          <div class="card-header">
            <span class="card-id">test</span>
            <h2 class="card-name">Schiggy</h2>
          </div>
          <div class="card-image-box">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/7.png" alt="Schiggy" data-id="card-image" loading="lazy" />
          </div>
          <div class="card-footer">
            <span class="type-badge">Water</span>
          </div>
        </button>
      </div>

      <dialog data-id="dialog">
        <button class="close-dialog" data-id="close-dialog-button" aria-label="Close dialog">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path
              d="M6.575 7.975L1.675 12.875C1.49167 13.0583 1.25833 13.15 0.975 13.15C0.691667 13.15 0.458333 13.0583 0.275 12.875C0.0916667 12.6917 0 12.4583 0 12.175C0 11.8917 0.0916667 11.6583 0.275 11.475L5.175 6.575L0.275 1.675C0.0916667 1.49167 0 1.25833 0 0.975C0 0.691667 0.0916667 0.458333 0.275 0.275C0.458333 0.0916667 0.691667 0 0.975 0C1.25833 0 1.49167 0.0916667 1.675 0.275L6.575 5.175L11.475 0.275C11.6583 0.0916667 11.8917 0 12.175 0C12.4583 0 12.6917 0.0916667 12.875 0.275C13.0583 0.458333 13.15 0.691667 13.15 0.975C13.15 1.25833 13.0583 1.49167 12.875 1.675L7.975 6.575L12.875 11.475C13.0583 11.6583 13.15 11.8917 13.15 12.175C13.15 12.4583 13.0583 12.6917 12.875 12.875C12.6917 13.0583 12.4583 13.15 12.175 13.15C11.8917 13.15 11.6583 13.0583 11.475 12.875L6.575 7.975Z"
              fill="currentColor" />
          </svg>
        </button>

        <div class="dialog-nav">
          <button class="prev-button" data-id="prev-button" aria-label="Previous image">
            <svg width="22" height="19" viewBox="0 0 22 19" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path
                d="M12.8028 0.292893C12.4123 -0.0976311 11.7791 -0.0976311 11.3886 0.292893C10.9981 0.683417 10.9981 1.31658 11.3886 1.70711L18.1673 8.48584H1C0.447715 8.48584 0 8.93355 0 9.48584C0 10.0381 0.447715 10.4858 1 10.4858H18.1662L11.3886 17.2635C10.9981 17.654 10.9981 18.2871 11.3886 18.6777C11.7791 19.0682 12.4123 19.0682 12.8028 18.6777L21.2614 10.2191C21.4582 10.0364 21.5814 9.77553 21.5814 9.48584C21.5814 9.29694 21.529 9.12027 21.438 8.96957C21.3969 8.90137 21.3469 8.83702 21.2881 8.77817L12.8028 0.292893Z"
                fill="currentColor" />
            </svg>
          </button>
          <button class="next-button" data-id="next-button" aria-label="Next image">
            <svg width="22" height="19" viewBox="0 0 22 19" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path
                d="M12.8028 0.292893C12.4123 -0.0976311 11.7791 -0.0976311 11.3886 0.292893C10.9981 0.683417 10.9981 1.31658 11.3886 1.70711L18.1673 8.48584H1C0.447715 8.48584 0 8.93355 0 9.48584C0 10.0381 0.447715 10.4858 1 10.4858H18.1662L11.3886 17.2635C10.9981 17.654 10.9981 18.2871 11.3886 18.6777C11.7791 19.0682 12.4123 19.0682 12.8028 18.6777L21.2614 10.2191C21.4582 10.0364 21.5814 9.77553 21.5814 9.48584C21.5814 9.29694 21.529 9.12027 21.438 8.96957C21.3969 8.90137 21.3469 8.83702 21.2881 8.77817L12.8028 0.292893Z"
                fill="currentColor" />
            </svg>
          </button>
        </div>
      </dialog>
    </main>

    <script src="assets/js/db.js"></script>
    <script src="assets/js/template.js"></script>
    <script src="script.js"></script>
  </body>
</html>
