<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex</title>
    <link rel="icon" type="image/svg+xml" href="favicon.png" />
    <link rel="stylesheet" href="assets/css/standard.css" />
    <link rel="stylesheet" href="assets/css/grid.css" />
    <link rel="stylesheet" href="assets/css/dialog.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="pokedex-header">
      <div class="header-container">
        <div class="heading">
          <svg class="poke-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="3"></circle>
            <line x1="2" y1="12" x2="9" y2="12"></line>
            <line x1="15" y1="12" x2="22" y2="12"></line>
          </svg>
          <h1 class="heading-name">Pokédex</h1>
        </div>
        <div class="search-wrapper">
          <input type="search" name="search" class="search-input" data-id="search-input" placeholder="Search Pokémon..." aria-label="Search for Pokémon" />
          <ul id="suggestion-list"></ul>
        </div>
      </div>
    </header>

    <main data-id="content">
      <div class="loader-card" id="loader-card">
        <div class="sprite-box">
          <img src="https://play.pokemonshowdown.com/sprites/ani/snorlax.gif" alt="Snorlax" class="snorlax-sprite" />
          <span class="zzz z1">Z</span>
          <span class="zzz z2">Z</span>
          <span class="zzz z3">Z</span>
        </div>
        <div class="status-text">Someone fell asleep on the server.<br />Waking him up...</div>
      </div>

      <section aria-label="Pokémon list">
        <ul id="card-content" class="pokemon-grid"></ul>
      </section>

      <div id="loading">Catching more Pokémons...</div>

      <dialog open data-id="dialog" aria-label="Pokémon details" class="pokemon-dialog"></dialog>
    </main>

    <script src="assets/js/db.js"></script>
    <script src="assets/js/template.js"></script>
    <script src="script.js"></script>
  </body>
</html>
